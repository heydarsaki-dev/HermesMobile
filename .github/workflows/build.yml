name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/helms.jks \
            -alias helmlab \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass helmlab -keypass helmlab \
            -dname "CN=Hermes Mobile, OU=HelmLab, O=HelmLab, L=Tehran, C=IR"

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-mobile-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Commit and push APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p release
          cp app/build/outputs/apk/release/*.apk release/HermesMobile-latest.apk
          git add release/HermesMobile-latest.apk
          git diff --staged --quiet || git commit -m "chore: build APK from CI [skip ci]"
          git push

      - name: Summary
        run: |
          echo "APK built: app/build/outputs/apk/release/" >> $GITHUB_STEP_SUMMARY
          echo "Artifact: hermes-mobile-apk" >> $GITHUB_STEP_SUMMARY